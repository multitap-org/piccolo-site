# The shared look (assets/README.md): MANIFEST lists exactly what's in
# assets/v1/, and index.html carries the current sites bar and footer.
name: Check

on:
  push:
  pull_request:

jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: MANIFEST is current
        run: |
          tools/make-manifest.sh
          git diff --exit-code assets/v1/MANIFEST || { echo "run tools/make-manifest.sh"; exit 1; }
      - name: Sites bar and footer are current
        run: |
          tools/sync-snippets.sh assets/v1 index.html pair/index.html
          git diff --exit-code index.html pair/index.html || { echo "run tools/sync-snippets.sh assets/v1 index.html pair/index.html"; exit 1; }
      # get-piccolo.app/play/ is the piccolo-web image (piccolo's web.yml), not
      # this repo: a play/ folder here is a mistake nobody serves (2026-11-22).
      - name: No play/ folder
        run: |
          if git ls-files --error-unmatch play >/dev/null 2>&1; then
            echo "play/ must not be in piccolo-site: /play/ is the piccolo-web image (docs/sites.md)"
            exit 1
          fi
