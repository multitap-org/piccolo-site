<!doctype html>
<!-- piccoletto in the browser: piccolo's companion (the gamepad, remote play,
     devices). The app runs as on a phone; its controls are this page's
     (piccoletto-shell.js, the app's web_shell.h): the strip, SETTINGS as a
     panel like piccolo's FILES, the quick menu, the touch pad. The canvas
     only shows REMOTE PLAY's picture. Mockups: piccolo-agents
     docs/mockups/piccoletto-web. piccolo's web/package.sh puts this folder in
     the web zip as piccoletto/, next to piccolo's pages; the shared scripts
     and sw.js are one folder up (frontends-common's web/), the websites'
     look in ../_site/v1. Everything here is relative. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1A2840">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>piccoletto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png">
<link rel="stylesheet" href="../_site/v1/site.css">
<style>
  /* The look is piccolo's websites' (../_site/v1/site.css: tokens, fonts) and
     piccolo's page (core.html): the strip, FILES' panel, the pad. */
  html, body { height: 100%; overflow: hidden; }
  body { font-size: 13px; line-height: 1.4; touch-action: manipulation; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #app { display: flex; flex-direction: column; height: 100dvh; }

  /* The strip (piccolo's core.html). */
  #strip { flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; background: var(--band);
           border-bottom: 2px solid var(--shadow); }
  #strip a.home { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none;
                  font: 600 17px/1 var(--font-heading); white-space: nowrap; }
  #strip a.home img { width: 22px; height: 22px; }
  #strip a.home span { font: 400 13px/1 var(--font-text); color: var(--muted); }
  #strip .hostchip { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border: 2px solid var(--edge); font-size: 11px;
                     letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #strip .space { flex: 1; }
  #strip button { min-height: 26px; padding: 2px 10px; background: var(--bg); border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--shadow);
                  font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  #strip button:hover, #strip button.active { border-color: var(--accent); }
  #strip .short { display: none; }
  /* While a mode is played the strip steps aside (as piccolo's while a game runs). */
  body.playing #strip { display: none; }

  #main { flex: 1; min-height: 0; display: flex; position: relative; }
  #stage { position: relative; flex: 1; min-width: 0; min-height: 0; background: #000; display: flex; align-items: center;
           justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; outline: none; flex: none; }
  .lamp { display: inline-block; width: 8px; height: 8px; flex: none; background: var(--grid); border: 1px solid var(--shadow); }
  .lamp.on { background: var(--good); }

  /* Over the canvas: the page when nothing streams (HOME's card, GAMEPAD,
     a guest's card). The canvas stays under it, sized: SDL needs it. */
  #cover { position: absolute; inset: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; justify-content: center;
           padding: 16px; overflow-y: auto; }
  body.streaming #cover { display: none; }
  .card { background: var(--band); border: 2px solid var(--shadow); box-shadow: 6px 6px 0 var(--shadow); padding: 18px 20px;
          width: min(440px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .card .kicker { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .card h2 { margin: 0; font: 600 26px/1.1 var(--font-heading); color: var(--text); overflow-wrap: anywhere; }
  .card .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .card .facts span { display: flex; gap: 5px; align-items: center; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .card small { color: var(--muted); font-size: 11px; }
  .card .bad { color: var(--accent); font-size: 12px; }
  .btn { min-height: 38px; padding: 4px 14px; background: var(--bg); color: var(--text); border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--shadow);
         font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.wide { flex: 1; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .leds { display: inline-flex; gap: 4px; align-items: center; }
  .leds i { width: 14px; height: 10px; background: var(--grid); border: 1px solid var(--shadow); font-style: normal; font-size: 8px;
            display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .leds i.on { background: var(--accent); color: var(--on-accent); }

  /* Over the picture: the status chip, the quick menu's button, why there's no picture. */
  .chip { position: absolute; left: 8px; top: 8px; z-index: 3; display: flex; gap: 6px; align-items: center; padding: 2px 7px;
          background: rgba(16, 24, 40, 0.55); color: #E0E6F0; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  #menu-open { position: absolute; right: 8px; top: 8px; z-index: 3; width: 40px; height: 34px; background: rgba(16, 24, 40, 0.45);
               color: #E0E6F0; border: 2px solid rgba(224, 230, 240, 0.35); font-weight: 700; font-size: 16px; cursor: pointer; }
  #why { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 6px 12px; background: rgba(16, 24, 40, 0.7);
         color: #E0E6F0; letter-spacing: 0.1em; text-transform: uppercase; font-size: 12px; text-align: center; }

  /* SETTINGS: FILES' twin (piccolo's core.html / piccolo-files.js). */
  #pane { width: 320px; flex: none; display: flex; flex-direction: column; background: var(--band); border-left: 2px solid var(--shadow);
          font-size: 12px; text-transform: uppercase; z-index: 4; }
  #pane.closed { display: none; }
  #pane header { display: flex; align-items: center; gap: 4px; padding: 4px 6px; background: var(--bg); border-bottom: 2px solid var(--shadow);
                 font-weight: 700; letter-spacing: 0.08em; }
  #pane header .title { flex: 1; }
  #pane button.plain { background: transparent; border: 1px solid transparent; padding: 1px 5px; font-size: 11px; letter-spacing: 0.08em;
                       text-transform: uppercase; cursor: pointer; }
  #pane button.plain:hover { border-color: var(--accent); }
  #pane-path { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--shadow); color: var(--muted); }
  #pane-path button { padding: 0 1px; color: var(--muted); }
  #pane-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #pane-list li { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-bottom: 1px solid var(--shadow); min-height: 32px; }
  #pane-list li:hover { background: var(--grid); }
  #pane-list li.folder { cursor: pointer; color: var(--link); font-weight: 700; }
  #pane-list li.head { color: var(--muted); font-size: 10px; letter-spacing: 0.12em; background: var(--bg); min-height: 0; padding: 3px 6px; }
  #pane-list li.picked { box-shadow: inset 0 0 0 2px var(--accent); }
  #pane-list li.block { flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 6px; }
  #pane-list li.block:hover, #pane-list li.head:hover { background: transparent; }
  #pane-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pane-list .size { color: var(--muted); font-size: 11px; white-space: nowrap; }
  #pane-list .actions { display: flex; gap: 2px; visibility: hidden; }
  #pane-list li:hover .actions, #pane-list li.picked .actions { visibility: visible; }
  @media (hover: none) { #pane-list .actions { visibility: visible; } }
  #pane-list .actions button { padding: 2px 6px; font-size: 10px; background: transparent; border: 1px solid var(--edge); letter-spacing: 0.06em;
                               text-transform: uppercase; cursor: pointer; }
  #pane-list .actions button:hover { border-color: var(--accent); }
  #pane-list .actions button.go { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  #pane-list .value { font-size: 11px; white-space: nowrap; }
  #pane-list .hint { color: var(--muted); font-size: 10px; letter-spacing: 0.04em; text-transform: none; }
  #pane-list .field { flex: 1; min-width: 0; height: 30px; background: var(--bg); border: 2px solid var(--edge); color: var(--text);
                      font: inherit; font-size: 12px; padding: 0 6px; text-transform: uppercase; }
  #pane-list li.choice { cursor: pointer; }
  #pane-list li.choice .radio { width: 12px; height: 12px; border: 2px solid var(--edge); flex: none; }
  #pane-list li.choice.on .radio { background: var(--accent); border-color: var(--accent); }
  .bigcode { font: 700 26px/1.1 var(--font-text); letter-spacing: 0.08em; text-align: center; padding: 8px 0; background: var(--bg);
             border: 2px solid var(--accent); font-variant-numeric: tabular-nums; }
  #pane footer { padding: 4px 6px; border-top: 1px solid var(--shadow); color: var(--muted); font-size: 10px; letter-spacing: 0.08em; }

  /* QUICK MENU: a slide-out over the screen, vertical tabs (piccolo's QUICK MENU). */
  #qm { position: absolute; inset: 0; z-index: 6; }
  #qm .dim { position: absolute; inset: 0; background: rgba(16, 24, 40, 0.6); }
  #qm .panel { position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 94%); display: flex; background: var(--band);
               border-left: 2px solid var(--shadow); box-shadow: -6px 0 0 var(--shadow); text-transform: uppercase; font-size: 12px; }
  #qm .tabs { flex: none; width: 84px; display: flex; flex-direction: column; background: var(--bg); border-right: 2px solid var(--shadow); }
  #qm .tabs button { min-height: 50px; padding: 6px 4px; background: transparent; border: 0; border-bottom: 1px solid var(--shadow);
                     font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  #qm .tabs button[aria-selected="true"] { background: var(--band); color: var(--heading-accent); box-shadow: inset 4px 0 0 var(--accent); }
  #qm .tabs .space { flex: 1; }
  #qm .body { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
  #qm h3 { margin: 0; padding: 10px 12px 4px; font: 600 18px/1.1 var(--font-heading); text-transform: none; color: var(--text); }
  #qm .sub { padding: 0 12px 8px; color: var(--muted); font-size: 10px; letter-spacing: 0.08em; display: flex; gap: 6px; align-items: center; }
  #qm .items { display: flex; flex-direction: column; gap: 8px; padding: 6px 12px 14px; }
  #qm .item { min-height: 46px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg); border: 2px solid var(--edge);
              box-shadow: 3px 3px 0 var(--shadow); font-weight: 700; letter-spacing: 0.08em; cursor: pointer; text-align: left; font-size: 12px;
              text-transform: uppercase; }
  #qm .item .grow { flex: 1; }
  #qm .item small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; letter-spacing: 0.04em; text-transform: none; }
  #qm .item.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  #qm .item.primary small { color: var(--on-accent); }
  #qm .item.leave { border-color: var(--accent); }
  #qm .item.on { border-color: var(--accent); }
  #qm .radio { width: 12px; height: 12px; border: 2px solid var(--edge); flex: none; }
  #qm .item.on .radio { background: var(--accent); border-color: var(--accent); }
  #qm .seg3 { display: flex; }
  #qm .seg3 button { flex: 1; min-height: 42px; background: var(--bg); border: 2px solid var(--edge); font-size: 10px; font-weight: 700;
                     letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  #qm .seg3 button + button { border-left: 0; }
  #qm .seg3 button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  #qm .label { font-size: 10px; letter-spacing: 0.12em; color: var(--muted); padding-top: 4px; }
  #qm .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding: 4px 12px 10px; font-size: 11px; font-variant-numeric: tabular-nums; margin: 0; }
  #qm .stats dt { color: var(--muted); } #qm .stats dd { margin: 0; text-align: right; }
  .port { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 2px solid var(--edge); background: var(--bg); min-height: 46px; }
  .port .n { width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--grid); font-weight: 700; }
  .port .devs { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; text-transform: none; }
  .port .dev { text-align: left; background: transparent; border: 1px solid transparent; padding: 2px 4px; cursor: pointer; font-size: 11px;
               text-transform: uppercase; letter-spacing: 0.04em; }
  .port .dev.yours { color: var(--heading-accent); }
  .port .dev.picked { border-color: var(--link); }
  .port .none { color: var(--muted); font-size: 11px; }
  .port .move { padding: 6px 8px; background: var(--accent); color: var(--on-accent); border: 0; font-weight: 700; font-size: 10px;
                letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }

  /* A preset too slow here: KEEP / REVERT over everything. */
  #sheet { position: absolute; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center; background: rgba(16, 24, 40, 0.6); padding: 16px; }

  #overlay { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center;
             background: var(--bg); text-transform: uppercase; letter-spacing: 1px; text-align: center; padding: 16px; }
  #overlay.gone { display: none; }
  #overlay .box { max-width: 36em; }
  #overlay progress { width: 16em; height: 6px; margin-top: 12px; accent-color: var(--accent); }

  /* The touch pad (frontends-common's multitap-pad.js; the look of piccolo's core.html). */
  .pad { display: none; }
  body.has-pad #main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr);
                       grid-template-areas: "padl stage padr"; }
  body.has-pad #stage { grid-area: stage; }
  body.has-pad #pad-left { grid-area: padl; }
  body.has-pad #pad-right { grid-area: padr; }
  body.has-pad #pad-meta, .pad-button.meta.upright { display: none; }
  body.has-pad .pad { display: flex; flex-direction: column; align-items: center; justify-content: space-around; gap: 3vmin;
                      padding: 3vmin; background: var(--band); touch-action: none; user-select: none; -webkit-user-select: none;
                      -webkit-touch-callout: none; --unit: min(15vh, 9vw, 72px); }
  body.has-pad #pane { position: fixed; inset: 0 0 0 auto; width: min(100%, 360px); }
  @media (orientation: portrait) {
    /* Like a Game Boy: the picture on top, the pad way down where the thumbs
       are (Andrés), the room between left empty. */
    body.has-pad #main { grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0, 1fr) auto auto;
                         grid-template-areas: "stage stage" "gap gap" "padl padr" "padm padm"; }
    body.has-pad #stage { aspect-ratio: var(--picture-aspect, 4 / 3); max-height: 62vh; }
    body.has-pad.mode-gamepad #stage { aspect-ratio: auto; max-height: none; grid-row: 1 / 3; }
    body.has-pad .pad { --unit: min(13vw, 72px); padding: 3vw 3vw 2vw; border-top: 0; justify-content: flex-end; }
    body.has-pad #pad-meta { display: flex; grid-area: padm; flex-direction: row; justify-content: center; gap: 5vw; padding: 2vw 3vw 7vw; }
    body.has-pad .pad-button.meta.sideways { display: none; }
    body.has-pad .pad-button.meta.upright { display: flex; }
  }
  .pad-button { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
                border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--shadow); font-weight: 700; letter-spacing: 0.06em; }
  .pad-button.held, .dpad span.held { background: var(--accent); color: var(--on-accent); border-color: var(--accent); box-shadow: 1px 1px 0 var(--shadow); }
  .pad-button.round { width: var(--unit); height: var(--unit); border-radius: 50%; font-size: calc(var(--unit) * 0.38); }
  .pad-button.shoulder { width: calc(var(--unit) * 2.4); height: calc(var(--unit) * 0.7); border-radius: 10px 10px 4px 4px; font-size: calc(var(--unit) * 0.3); }
  .pad-button.meta { width: calc(var(--unit) * 1.6); height: calc(var(--unit) * 0.5); border-radius: 999px; font-size: 10px; }
  .dpad { position: relative; width: calc(var(--unit) * 2.6); height: calc(var(--unit) * 2.6); }
  .dpad span { position: absolute; width: calc(var(--unit) * 0.9); height: calc(var(--unit) * 0.9); background: var(--bg);
               border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--shadow); }
  .dpad .up { left: calc(var(--unit) * 0.85); top: 0; }
  .dpad .down { left: calc(var(--unit) * 0.85); bottom: 0; }
  .dpad .left { left: 0; top: calc(var(--unit) * 0.85); }
  .dpad .right { right: 0; top: calc(var(--unit) * 0.85); }
  .face { position: relative; width: calc(var(--unit) * 2.6); height: calc(var(--unit) * 2.6); }
  .face .pad-button { position: absolute; }
  .face.four .x { left: calc(var(--unit) * 0.8); top: 0; }
  .face.four .y { left: 0; top: calc(var(--unit) * 0.8); }
  .face.four .a { right: 0; top: calc(var(--unit) * 0.8); }
  .face.four .b { left: calc(var(--unit) * 0.8); bottom: 0; }

  /* Narrow screens: the panel goes over the page; the strip keeps the buttons. */
  @media (max-width: 640px) {
    #pane { position: fixed; inset: 38px 0 0 auto; width: min(100%, 360px); }
    #strip { gap: 6px; padding: 0 6px; }
    #strip a.home { font-size: 0; gap: 0; }
    #strip a.home span, #strip .space, #strip .hostchip { display: none; }
    #strip button { flex: 1 1 0; min-width: 0; padding: 2px 4px; overflow: hidden; text-overflow: ellipsis; }
    #strip .long { display: none; }
    #strip .short { display: inline; }
  }
  /* ?ui=app: piccoletto's own screens in the canvas, the page steps aside. */
  body.app-ui #strip, body.app-ui #cover, body.app-ui #pane, body.app-ui .chip, body.app-ui #menu-open { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="strip">
    <a class="home" href="../" title="Back to piccolo in the browser"><img src="icon-32.png" alt="">piccolo <span>play / piccoletto</span></a>
    <span class="hostchip" id="strip-host" hidden></span>
    <span class="space"></span>
    <button id="pair-open" type="button" title="Pair with a piccolo">Pair</button>
    <button id="settings-open" type="button" title="Your hosts and this browser's settings">Settings</button>
    <button id="pad-toggle" type="button" title="Buttons on the screen, beside or under the picture">Pad</button>
    <button id="fullscreen" type="button" title="piccoletto on the whole screen (Esc leaves)"><span class="long">Full screen</span><span class="short">Full</span></button>
  </div>
  <div id="main">
    <div class="pad" id="pad-left"></div>
    <div id="stage">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
      <div id="cover"></div>
      <span class="chip" id="chip" hidden></span>
      <div id="why" hidden></div>
      <button id="menu-open" type="button" title="Quick menu (Esc)" hidden>&#9776;</button>
    </div>
    <div class="pad" id="pad-right"></div>
    <div class="pad" id="pad-meta"></div>
    <aside id="pane" class="closed" aria-label="Settings">
      <header>
        <span class="title">Settings</span>
        <button class="plain" id="pane-hosts" type="button" title="Your paired hosts">Hosts</button>
        <button class="plain" id="pane-pair" type="button" title="Pair with a piccolo">Pair</button>
        <button class="plain" id="pane-close" type="button" title="Hide the panel">&times;</button>
      </header>
      <div id="pane-path"></div>
      <ul id="pane-list"></ul>
      <footer id="pane-footer"></footer>
    </aside>
    <div id="qm" hidden></div>
    <div id="sheet" hidden></div>
  </div>
</div>
<div id="overlay"><div class="box"><div id="message">LOADING PICCOLETTO</div><progress id="progress" max="1" value="0"></progress></div></div>
<script src="../multitap-storage.js"></script>
<script src="../multitap-page.js"></script>
<script src="../multitap-pad.js"></script>
<script src="piccoletto-page.js"></script>
<script src="piccoletto-shell.js"></script>
<script>
  multitap_pad_start({ root: '#main', kind: 'snes', state: 'piccoletto_web_pad', show: null, toggle: 'pad-toggle',
                       storage_key: 'piccoletto-pad-shown', menu_button: false, on_shown: piccoletto_shell_pad_shown,
                       observe: ['main', 'pad-left', 'pad-right', 'pad-meta'] });
  piccoletto_shell_start();
  piccoletto_page_start();
</script>
</body>
</html>
