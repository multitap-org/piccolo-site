<!doctype html>
<!-- piccolo in the browser: one page per core (web/package.sh copies this as
     <core>/index.html next to piccolo.js / .wasm / .data). Everything here
     is relative, so the folder works anywhere on any static server. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>piccolo: piccobots</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-32.png">
<link rel="stylesheet" href="../_site/v1/site.css">
<style>
  /* The look is piccolo's websites' (_site/v1/site.css: tokens, fonts), but
     no sites bar: the game owns the screen. A thin strip on top instead. */
  html, body { height: 100%; overflow: hidden; }
  body { font-size: 13px; line-height: 1.4; }
  button { font: inherit; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #strip { flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; background: var(--band);
           border-bottom: 2px solid var(--shadow); }
  #strip a.home { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none;
                  font: 600 17px/1 var(--font-heading); white-space: nowrap; }
  #strip a.home img { width: 22px; height: 22px; }
  #strip a.home span { font: 400 13px/1 var(--font-text); color: var(--muted); }
  #strip .channel { padding: 1px 6px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; }
  #strip .space { flex: 1; }
  #strip button { min-height: 26px; padding: 2px 10px; background: var(--bg); color: var(--text); border: 2px solid var(--edge);
                  box-shadow: 2px 2px 0 var(--shadow); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  #strip button:hover, #strip button.active { border-color: var(--accent); }
  #strip button.active { background: var(--accent); color: var(--on-accent); }
  #strip button[hidden] { display: none; }
  #strip button { white-space: nowrap; }
  #strip .short { display: none; }
  #main { flex: 1; min-height: 0; display: flex; }
  /* The canvas fills its stage; SDL takes the window's size from the canvas's
     CSS size (multitap-page.js sends a resize event when the stage changes),
     and piccolo places and scales the picture inside it. */
  #stage { position: relative; flex: 1; min-width: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; outline: none; flex: none; }
  /* While a game is played (piccolo says so: multitap_page_game), the strip
     steps aside; the menu (MENU, Esc) brings it back. */
  body.playing #strip { display: none; }
  body.playing #files { top: 0; }
  #overlay { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
             background: var(--bg); text-transform: uppercase; letter-spacing: 1px; text-align: center; padding: 16px; }
  #overlay.gone { display: none; }
  #overlay .box { max-width: 36em; }
  #overlay progress { width: 16em; height: 6px; margin-top: 12px; accent-color: var(--accent); }
  body.dragging::after { content: "DROP A GAME (OR, ON THE FILES PANEL, A FILE FOR THAT FOLDER)"; position: fixed; inset: 12px;
                         z-index: 6; border: 2px dashed var(--accent); display: flex; align-items: center; justify-content: center;
                         color: var(--text); background: rgba(16, 24, 40, 0.75); letter-spacing: 2px; pointer-events: none;
                         text-align: center; padding: 16px; }

  /* FILES: the session's filesystem (piccolo-files.js). */
  #files { width: 320px; flex: none; display: flex; flex-direction: column; background: var(--band);
           border-left: 2px solid var(--shadow); font-size: 12px; text-transform: uppercase; }
  #files.closed { display: none; }
  #files header { display: flex; align-items: center; gap: 4px; padding: 4px 6px; background: var(--bg);
                  border-bottom: 2px solid var(--shadow); font-weight: 700; letter-spacing: 0.08em; }
  #files header .title { flex: 1; }
  #files button { background: transparent; color: var(--text); border: 1px solid transparent; padding: 1px 5px;
                  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  #files button:hover { border-color: var(--accent); }
  #files-path { display: flex; flex-wrap: wrap; padding: 4px 6px; border-bottom: 1px solid var(--shadow); color: var(--muted);
                text-transform: none; }
  #files-path button { padding: 0 1px; color: var(--muted); text-transform: none; letter-spacing: 0; }
  #files-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; text-transform: none; }
  #files-list li { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-bottom: 1px solid var(--shadow); }
  #files-list li:hover { background: var(--grid); }
  #files-list li.folder { cursor: pointer; color: var(--link); font-weight: 700; }
  #files-list li.empty { color: var(--muted); justify-content: center; padding: 12px; text-transform: uppercase; }
  #files-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files-list .size { color: var(--muted); font-size: 11px; white-space: nowrap; }
  #files-list .actions { display: flex; gap: 2px; visibility: hidden; }
  #files-list li:hover .actions { visibility: visible; }
  #files-list .actions button { padding: 0 4px; font-size: 10px; border-color: var(--edge); }
  #files footer { padding: 4px 6px; border-top: 1px solid var(--shadow); color: var(--muted); font-size: 10px; letter-spacing: 0.08em; }
  /* Touch screens have no hover: the actions always show. */
  @media (hover: none) { #files-list .actions { visibility: visible; } }
  /* Narrow screens: the panel goes over the game instead of beside it; the
     strip keeps only the buttons. */
  @media (max-width: 640px) {
    #files { position: fixed; inset: 38px 0 0 auto; width: min(100%, 360px); z-index: 4; }
    /* The strip on a phone: the icon, then the buttons sharing the rest in
       equal parts, short labels, never wrapping. */
    #strip { gap: 6px; padding: 0 6px; }
    #strip a.home { font-size: 0; gap: 0; }
    #strip a.home span, #strip .space { display: none; }
    #strip .channel { font-size: 10px; padding: 1px 4px; }
    #strip button { flex: 1 1 0; min-width: 0; padding: 2px 4px; overflow: hidden; text-overflow: ellipsis; }
    #strip .long { display: none; }
    #strip .short { display: inline; }
  }
  /* A phone upright: like a Game Boy, the game on top and FILES under it,
     open from the start (piccolo-files.js); closed, the game has it all. */
  @media (max-width: 640px) and (orientation: portrait) {
    #main { flex-direction: column; }
    #files { position: static; inset: auto; width: auto; height: 42%; z-index: auto;
             border-left: 0; border-top: 2px solid var(--shadow); }
  }

  /* The touch gamepad (piccolo-pad.js), when shown (body.has-pad): beside
     the picture, or under it on an upright screen; FILES goes over the game. */
  .pad { display: none; }
  body.has-pad #main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr);
                       grid-template-areas: "padl stage padr"; }
  body.has-pad #stage { grid-area: stage; }
  body.has-pad #pad-left { grid-area: padl; }
  body.has-pad #pad-right { grid-area: padr; }
  /* SELECT / START: in the halves sideways, a row of their own upright. */
  body.has-pad #pad-meta, .pad-button.meta.upright { display: none; }
  body.has-pad .pad { display: flex; flex-direction: column; align-items: center; justify-content: space-around; gap: 3vmin;
                      padding: 3vmin; background: var(--band); touch-action: none; user-select: none; -webkit-user-select: none;
                      -webkit-touch-callout: none; --unit: min(15vh, 9vw, 72px); }
  body.has-pad #files { position: fixed; inset: 38px 0 0 auto; width: min(100%, 360px); height: auto; z-index: 4;
                        border-top: 0; border-left: 2px solid var(--shadow); }
  @media (orientation: portrait) {
    /* Like a Game Boy: the picture on top, as tall as its shape needs once a
       game is running (piccolo tells its aspect: --picture-aspect), the pad
       takes all the rest. */
    body.has-pad #main { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) auto auto;
                         grid-template-areas: "stage stage" "padl padr" "padm padm"; }
    body.has-pad.has-picture #main { grid-template-rows: min(calc(100vw / var(--picture-aspect)), 62%) minmax(0, 1fr) auto; }
    /* (Two halves of 2.6 units: all of it fits 100vw.) */
    body.has-pad .pad { --unit: min(13vw, 72px); padding: 4vw 3vw; border-top: 2px solid var(--shadow); }
    body.has-pad #pad-meta { display: flex; grid-area: padm; flex-direction: row; justify-content: center; gap: 5vw;
                             padding: 2vw 3vw 7vw; border-top: 0; }
    body.has-pad .pad-button.meta.sideways { display: none; }
    body.has-pad .pad-button.meta.upright { display: flex; }
  }
  .pad-button { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
                border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--shadow); font-weight: 700; letter-spacing: 0.06em; }
  .pad-button.held, .dpad span.held { background: var(--accent); color: var(--on-accent); border-color: var(--accent);
                                      box-shadow: 1px 1px 0 var(--shadow); }
  .pad-button.round { width: var(--unit); height: var(--unit); border-radius: 50%; font-size: calc(var(--unit) * 0.38); }
  .pad-button.shoulder { width: calc(var(--unit) * 2.4); height: calc(var(--unit) * 0.7); border-radius: 10px 10px 4px 4px;
                         font-size: calc(var(--unit) * 0.3); }
  .pad-button.meta { width: calc(var(--unit) * 1.6); height: calc(var(--unit) * 0.5); border-radius: 999px; font-size: 10px; }
  .dpad { position: relative; width: calc(var(--unit) * 2.6); height: calc(var(--unit) * 2.6); }
  .dpad span { position: absolute; width: calc(var(--unit) * 0.9); height: calc(var(--unit) * 0.9); background: var(--bg);
               border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--shadow); }
  .dpad .up { left: calc(var(--unit) * 0.85); top: 0; }
  .dpad .down { left: calc(var(--unit) * 0.85); bottom: 0; }
  .dpad .left { left: 0; top: calc(var(--unit) * 0.85); }
  .dpad .right { right: 0; top: calc(var(--unit) * 0.85); }
  .face { position: relative; width: calc(var(--unit) * 2.6); height: calc(var(--unit) * 2.6); }
  .face .pad-button { position: absolute; }
  .face.four .x { left: calc(var(--unit) * 0.8); top: 0; }
  .face.four .y { left: 0; top: calc(var(--unit) * 0.8); }
  .face.four .a { right: 0; top: calc(var(--unit) * 0.8); }
  .face.four .b { left: calc(var(--unit) * 0.8); bottom: 0; }
  /* A and B close together, on a slant (as on a Game Boy). */
  /* (As tall as the d-pad, so both halves line up.) */
  .face.two { width: calc(var(--unit) * 2.15); }
  .face.two .b { left: 0; bottom: calc(var(--unit) * 0.35); }
  .face.two .a { right: 0; top: calc(var(--unit) * 0.35); }
</style>
</head>
<body data-channel="dev" data-pad="snes">
<div id="app">
  <div id="strip">
    <a class="home" href="../" title="Choose another emulator"><img src="../icon-32.png" alt="">piccolo <span>play / piccobots</span></a>
    <span class="channel" id="channel" hidden>DEV cd640e0</span>
    <span class="space"></span>
    <button id="open" hidden title="Open a game file (or drop it on the page)"><span class="long">Open game</span><span class="short">Open</span></button>
    <button id="files-toggle" hidden title="This session's files: saves, states, settings, games">Files</button>
    <button id="pad-toggle" title="Buttons on the screen, beside or under the game">Pad</button>
    <button id="fullscreen" title="The game on the whole screen (Esc leaves)"><span class="long">Full screen</span><span class="short">Full</span></button>
  </div>
  <div id="main">
    <div class="pad" id="pad-left"></div>
    <div id="stage">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <div class="pad" id="pad-right"></div>
    <div class="pad" id="pad-meta"></div>
    <aside id="files" class="closed">
      <header>
        <span class="title">Files</span>
        <button id="files-home" title="piccolo's folder">Home</button>
        <button id="files-upload" title="Add files to this folder (or drop them on this panel)">Add</button>
        <button id="files-refresh" title="Read the folder again">Reload</button>
        <button id="files-close" title="Hide the panel">&times;</button>
      </header>
      <div id="files-path"></div>
      <ul id="files-list"></ul>
      <footer id="files-usage"></footer>
      <input id="files-input" type="file" multiple hidden>
    </aside>
  </div>
</div>
<div id="overlay"><div class="box"><div id="message">LOADING PICCOLO</div><progress id="progress" max="1" value="0"></progress></div></div>
<input id="file" type="file" hidden>
<script src="../piccolo-gl-state.js"></script>   <!-- before piccolo makes its WebGL context -->
<script src="../multitap-storage.js"></script>
<script src="../multitap-page.js"></script>
<script src="../piccolo-files.js"></script>
<script src="../piccolo-page.js"></script>
<script src="../piccolo-pad.js"></script>
<script>piccolo_pad_start();</script>
<script>piccolo_page_start();</script>
</body>
</html>
